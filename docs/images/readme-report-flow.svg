<text x="750" y="253" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#c2410c">Direct read</text><text x="750" y="282" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">CLI reads remote source</text><text x="750" y="306" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">CLI's own credentials</text>
