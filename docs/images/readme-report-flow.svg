<text x="440" y="166" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#6d28d9">Configured destination</text><text x="440" y="199" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">File · Amazon S3</text><text x="440" y="225" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#334155">Azure Blob · PVC</text><text x="440" y="248" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Selected in resource spec</text>
