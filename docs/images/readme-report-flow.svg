<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
<title id="title">Mirops report storage and consumers</title><desc id="desc">The operator writes reports to file, S3, Azure Blob, or PVC. The operator report service serves reports to the Headlamp plugin. CLI consumers can read remote report sources directly with their own credentials.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#ecfdf5"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
<rect width="1100" height="380" rx="26" fill="url(#bg)"/><text x="48" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">Reports have flexible storage and reader paths</text>
