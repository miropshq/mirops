<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
<title id="title">Mirops readiness score and upgrade decision</title><desc id="desc">Four weighted dimensions contribute to a 0 to 100 readiness score. Separately, deterministic blocker checks determine SAFE, WARNING, or CRITICAL and decision.allow. Optional AI can influence the readiness score but cannot block or unblock the upgrade.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f3ff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
<rect width="1100" height="390" rx="26" fill="url(#bg)"/><text x="48" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">Two outputs answer two different questions</text>
<g filter="url(#s)"><rect x="50" y="115" width="230" height="185" rx="20" fill="#fff" stroke="#93c5fd" stroke-width="2"/><rect x="365" y="115" width="250" height="185" rx="20" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><rect x="700" y="75" width="330" height="125" rx="20" fill="#fff" stroke="#6ee7b7" stroke-width="2"/><rect x="700" y="235" width="330" height="95" rx="20" fill="#fff" stroke="#fda4af" stroke-width="2"/></g>
<text x="165" y="153" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">Readiness score</text><text x="165" y="183" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Health · capacity</text><text x="165" y="208" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Stability · compatibility</text><text x="165" y="243" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">0–100 health gauge</text><text x="165" y="272" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Optional AI may adjust this score</text>
<text x="490" y="153" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#6d28d9">Deterministic checks</text><text x="490" y="183" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Blockers and policy thresholds</text><text x="490" y="215" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">Separate from the score</text><text x="490" y="257" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#4338ca">Controls decision.allow</text>
<text x="865" y="116" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#15803d">SAFE / WARNING</text><text x="865" y="147" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Allowed; warning may need attention</text><text x="865" y="177" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">allow: true</text>
<text x="865" y="274" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#be123c">CRITICAL</text><text x="865" y="303" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Deterministic blockers · allow: false</text>
<path d="M280 205H354" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><path d="M615 175C655 175 665 137 689 137" stroke="#10b981" stroke-width="3" marker-end="url(#a)"/><path d="M615 235C655 235 665 280 689 280" stroke="#f43f5e" stroke-width="3" marker-end="url(#a)"/>
<text x="48" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">A low score or propagated graph risk alone never creates an upgrade blocker; optional AI cannot change the gate.</text></svg>