<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Mirops operator system flow</title><desc id="desc">The operator collects Kubernetes API state and builds a ClusterMirror with dependencies and risk. It publishes reports for the Headlamp plugin and CLI. UpgradeAnalysis is an opt-in operation.</desc>
