<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc">
<title id="title">Mirops upgrade analysis flow</title><desc id="desc">An UpgradeAnalysis selects a target version. The operator collects cluster state, builds a dependency graph and risk, calculates readiness dimensions, applies deterministic blockers, and publishes a report and resource status.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfeff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
<rect width="1100" height="410" rx="26" fill="url(#bg)"/><text x="48" y="50" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#172554">An opt-in analysis turns a target version into a report</text>
<g filter="url(#s)"><rect x="45" y="140" width="180" height="130" rx="18" fill="#fff" stroke="#93c5fd" stroke-width="2"/><rect x="290" y="140" width="190" height="130" rx="18" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><rect x="545" y="140" width="190" height="130" rx="18" fill="#fff" stroke="#6ee7b7" stroke-width="2"/><rect x="800" y="80" width="235" height="100" rx="18" fill="#fff" stroke="#86efac" stroke-width="2"/><rect x="800" y="220" width="235" height="100" rx="18" fill="#fff" stroke="#fda4af" stroke-width="2"/></g>
<text x="135" y="180" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">UpgradeAnalysis</text><text x="135" y="211" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Target Kubernetes</text><text x="135" y="238" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Version and scope</text>
<text x="385" y="180" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#6d28d9">Collect and model</text><text x="385" y="211" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Cluster state</text><text x="385" y="238" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Graph and risk</text>
<text x="640" y="180" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#047857">Evaluate</text><text x="640" y="211" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Health · capacity</text><text x="640" y="238" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#334155">Stability · compatibility</text>
<text x="917" y="119" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#15803d">SAFE or WARNING</text><text x="917" y="148" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">allow: true</text>
<text x="917" y="259" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#be123c">CRITICAL</text><text x="917" y="288" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#334155">allow: false · blockers listed</text>
