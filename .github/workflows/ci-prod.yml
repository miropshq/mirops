name: CI - Production (lint, test, build, semantic-release, push :vX.Y.Z)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

jobs:
  # ─── CI ───────────────────────────────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate code
        run: make generate

      - name: Generate manifests
        run: make manifests

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build binary
        run: make build

  # ─── semantic-release ─────────────────────────────────────────────────────────
  # Reads conventional commits and automatically:
  #   - Determines the next semver version (patch / minor / major)
  #   - Generates CHANGELOG.md
  #   - Creates a GitHub Release + tag
  #   - Triggers push-release via the `new_release_version` output
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Build nativo por arquitectura ────────────────────────────────────────────
  build-release:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag_suffix: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: linux-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}:v${{ needs.semantic-release.outputs.new_release_version }}-${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag_suffix }}

  # ─── Merge manifest list ────────────────────────────────────────────────────
  push-release:
    name: Push release image (merge manifest)
    runs-on: ubuntu-latest
    needs: [semantic-release, build-release]
    steps:
      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        env:
          VERSION: ${{ needs.semantic-release.outputs.new_release_version }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:v${VERSION} \
            -t ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:v${VERSION}-linux-amd64 \
            ghcr.io/${{ github.repository }}:v${VERSION}-linux-arm64

      - name: Inspect manifest
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:latest
