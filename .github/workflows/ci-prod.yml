name: CI - Production (lint, test, build, semantic-release, push :vX.Y.Z)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

jobs:
  # ─── CI ───────────────────────────────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate code
        run: make generate

      - name: Generate manifests
        run: make manifests

      - name: Lint Dockerfile (operator)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.operator

      - name: Lint Dockerfile (remediation)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.remediation

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build binary
        run: make build

  # ─── Upload CRDs ───────────────────────────────────────────────────────────────
  # Uploads CRDs generated from `make manifests` so the mirops-operator Helm chart
  # always consumes CRDs that match this commit — never the committed copy.
  upload-crds:
    name: Upload CRDs (prod)
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate manifests
        run: make manifests

      - name: Upload CRDs
        uses: actions/upload-artifact@v4
        with:
          name: crds-prod
          path: config/crd/bases/*.yaml
          if-no-files-found: error
          retention-days: 90

  # ─── semantic-release ─────────────────────────────────────────────────────────
  # Reads conventional commits and automatically:
  #   - Determines the next semver version (patch / minor / major)
  #   - Creates a GitHub Release + tag
  #   - Triggers push-release via the `new_release_version` output
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: upload-crds
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Build by architecture ─────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag_suffix: linux-amd64
            image: operator
            dockerfile: Dockerfile.operator
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: linux-arm64
            image: operator
            dockerfile: Dockerfile.operator
          - platform: linux/amd64
            runner: ubuntu-latest
            tag_suffix: linux-amd64
            image: remediation
            dockerfile: Dockerfile.remediation
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: linux-arm64
            image: remediation
            dockerfile: Dockerfile.remediation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:v${{ needs.semantic-release.outputs.new_release_version }}-${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.tag_suffix }}

  # ─── Merge manifest list ────────────────────────────────────────────────────
  push:
    name: Push release image (merge manifest) - ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        image: [operator, remediation]
    steps:
      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        env:
          VERSION: ${{ needs.semantic-release.outputs.new_release_version }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}/${{ matrix.image }}:v${VERSION} \
            -t ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest \
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:v${VERSION}-linux-amd64 \
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:v${VERSION}-linux-arm64

      - name: Inspect manifest
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
