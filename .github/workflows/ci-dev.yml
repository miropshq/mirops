name: CI - Development (lint, test, build, push :dev)

on:
  push:
    branches:
      - development

permissions:
  contents: read
  packages: write

jobs:
  # ─── CI ────────────────────────────────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate code
        run: make generate

      - name: Generate manifests
        run: make manifests

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build binary
        run: make build

  # ─── Build nativo por arquitectura ────────────────────────────────────────────
  # Cada runner compila y sube directamente con tag por arquitectura.
  # El job merge-dev combina ambos en un manifest list.
  build-dev:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag_suffix: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}:dev-${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag_suffix }}

  # ─── Merge manifest list ────────────────────────────────────────────────────
  # Combina los dos tags de arquitectura en un manifest list con los tags finales.
  merge-dev:
    name: Push dev image (merge manifest)
    runs-on: ubuntu-latest
    needs: build-dev
    steps:
      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:dev \
            -t ghcr.io/${{ github.repository }}:sha-${{ github.sha }} \
            ghcr.io/${{ github.repository }}:dev-linux-amd64 \
            ghcr.io/${{ github.repository }}:dev-linux-arm64

      - name: Inspect manifest
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}:dev
