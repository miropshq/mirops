name: CI - Development (lint, test, build, push :dev)

on:
  push:
    branches:
      - development

permissions:
  contents: read
  packages: write

jobs:
  # ─── CI ────────────────────────────────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate code
        run: make generate

      - name: Generate manifests
        run: make manifests

      # Upload the CRDs generated from the pushed code (output of `make manifests` above),
      # so the mirops-operator Helm chart consumes CRDs that always match this commit —
      # never the committed copy, which could be stale.
      - name: Upload CRDs
        uses: actions/upload-artifact@v4
        with:
          name: crds-dev
          path: config/crd/bases/*.yaml
          if-no-files-found: error
          retention-days: 30

      - name: Lint Dockerfile (operator)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.operator

      - name: Lint Dockerfile (remediation)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.remediation

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build binary
        run: make build

  # ─── Build nativo por arquitectura ────────────────────────────────────────────
  # Cada runner compila y sube directamente con tag por arquitectura.
  # El job merge-dev combina ambos en un manifest list.
  build-dev:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag_suffix: linux-amd64
            image: operator
            dockerfile: Dockerfile.operator
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: linux-arm64
            image: operator
            dockerfile: Dockerfile.operator
          - platform: linux/amd64
            runner: ubuntu-latest
            tag_suffix: linux-amd64
            image: remediation
            dockerfile: Dockerfile.remediation
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: linux-arm64
            image: remediation
            dockerfile: Dockerfile.remediation
    steps:
      - uses: actions/checkout@v4

      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:dev-${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.tag_suffix }}

  # ─── Merge manifest list ────────────────────────────────────────────────────
  # Combina los dos tags de arquitectura en un manifest list con los tags finales.
  merge-dev:
    name: Push dev image (merge manifest) - ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: build-dev
    strategy:
      matrix:
        image: [operator, remediation]
    steps:
      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}/${{ matrix.image }}:dev \
            -t ghcr.io/${{ github.repository }}/${{ matrix.image }}:sha-${{ github.sha }} \
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:dev-linux-amd64 \
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:dev-linux-arm64

      - name: Inspect manifest
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}/${{ matrix.image }}:dev
