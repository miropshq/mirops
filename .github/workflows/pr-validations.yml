name: CI - Feature / PR (validate)

# Validation-only pipeline. Runs on every PR targeting main. It never pushes
# images or artifacts — it only proves the code is sound so a green check means
# the PR is safe to merge.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  # ─── Compatibility matrix ─────────────────────────────────────────────────────
  # The binary embeds the add-on compatibility matrix via go:embed (internal/compat/matrix.yaml),
  # a git-ignored artifact pulled from the mirops-compat OCI repo. Every Go job below needs it at
  # compile time, so fetch it once here and share it as an artifact (same as the release pipeline).
  download-matrix-compat:
    name: matrix-compat
    runs-on: ubuntu-latest
    steps:
      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch compatibility matrix
        run: |
          oras pull ghcr.io/miropshq/mirops-compat:${{ vars.COMPAT_VERSION }} -o ./matrix-test
          cp "$(find ./matrix-test -name 'matrix.yaml' | head -1)" ./matrix.yaml
          grep -q '^addons:' ./matrix.yaml || { echo "pulled artifact is not a matrix (no 'addons:' key)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: ./matrix.yaml
          if-no-files-found: error

  # ─── Lint ──────────────────────────────────────────────────────────────────────
  # Go linter + golangci config check + Dockerfile linters.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: download-matrix-compat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # go:embed needs the matrix (internal/compat) and the CRDs (internal/crd) at compile time, or
      # golangci-lint's typecheck fails with "pattern *.yaml: no matching files found".
      - name: Download compatibility matrix
        uses: actions/download-artifact@v4
        with:
          name: matrix
          path: internal/compat/

      - name: Generate CRDs and code
        run: make manifests generate

      - name: Verify golangci-lint config
        run: make lint-config

      - name: Lint
        run: make lint

      - name: Lint Dockerfile (operator)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.operator

      - name: Lint Dockerfile (remediation)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.remediation

  # ─── Verify generated code ──────────────────────────────────────────────────────
  # Re-runs the generators and `go mod tidy`, then fails if the working tree is
  # dirty. This catches PRs that edited *_types.go but forgot to regenerate
  # DeepCopy/CRDs, or changed imports without tidying go.mod — a very common OSS
  # mistake that would otherwise only surface after merge.
  verify-generated:
    name: Verify generated code is up to date
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download compatibility matrix
        uses: actions/download-artifact@v4
        with:
          name: matrix
          path: internal/compat/

      - name: Regenerate code and manifests
        run: make generate manifests

      - name: Tidy modules
        run: go mod tidy

      - name: Fail if anything changed
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'make generate manifests' and 'go mod tidy', then commit the result."
            exit 1
          fi

  # ─── Test ──────────────────────────────────────────────────────────────────────
  # Unit tests with envtest (also runs fmt + vet via the test target).
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: verify-generated
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download compatibility matrix
        uses: actions/download-artifact@v4
        with:
          name: matrix
          path: internal/compat/

      - name: Test
        run: make test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out
          if-no-files-found: warn
          retention-days: 7

  # ─── Build ─────────────────────────────────────────────────────────────────────
  # Compiles the binary and builds both images (without pushing) to prove the
  # Dockerfiles still produce valid images for this commit.
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: operator
            dockerfile: Dockerfile.operator
          - image: remediation
            dockerfile: Dockerfile.remediation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download compatibility matrix
        uses: actions/download-artifact@v4
        with:
          name: matrix
          path: internal/compat/

      - name: Build binary
        run: make build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}-pr
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-pr

  # ─── Vulnerability scan ──────────────────────────────────────────────────────────
  # Checks the code and its dependencies against the Go vulnerability database.
  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    needs: build
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download compatibility matrix
        uses: actions/download-artifact@v4
        with:
          name: matrix
          path: internal/compat/

      - name: Generate CRDs and code
        run: make manifests generate

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Notify Slack
        if: ${{ always() && env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ github.workflow }} ${{ job.status }} for ${{ github.repository }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.workflow }}* — *${{ job.status }}*\n`${{ github.repository }}` · `${{ github.ref_name }}` · `${{ github.sha }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
                  }
                }
              ]
            }
