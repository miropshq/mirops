name: CI - Release (lint, test, build, semantic-release, push :vX.Y.Z)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

jobs:
  # ─── CI ───────────────────────────────────────────────────────────────────────
  
  download-matrix-compat:
    name: matrix-compat
    runs-on: ubuntu-latest
    steps:
      # Fetch the pinned add-on compatibility matrix and place it where go:embed expects it, so the
      # binary bakes in a known matrix version. Bump the COMPAT_VERSION repo variable to update it.
      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch compatibility matrix
        run: |
          oras pull ghcr.io/miropshq/mirops-compat:${{ vars.COMPAT_VERSION }} -o ./matrix-test
          cp "$(find ./matrix-test -name 'matrix.yaml' | head -1)" ./matrix.yaml
          # sanity: the pulled artifact must actually be the matrix
          grep -q '^addons:' ./matrix.yaml || { echo "pulled artifact is not a matrix (no 'addons:' key)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: matrix
          path: ./matrix.yaml
          if-no-files-found: error

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: download-matrix-compat
    steps:
      - uses: actions/checkout@v4

      # Drop the fetched matrix into internal/compat so go:embed (make test / make build) has it.
      - name: Download compatibility matrix
        uses: actions/download-artifact@v4
        with:
          name: matrix
          path: internal/compat/

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate code
        run: make generate

      - name: Generate manifests
        run: make manifests

      # make manifests just generated the CRDs; share them so the image build can embed them
      # (go:embed). The operator installs its own CRDs at startup, so the chart no longer ships them.
      - name: Upload CRDs
        uses: actions/upload-artifact@v4
        with:
          name: crds
          path: config/crd/bases/*.yaml
          if-no-files-found: error
          retention-days: 30

      - name: Lint Dockerfile (operator)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.operator

      - name: Lint Dockerfile (remediation)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile.remediation

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build binary
        run: make build

  # ─── semantic-release ─────────────────────────────────────────────────────────
  # Reads conventional commits and automatically:
  #   - Determines the next semver version (patch / minor / major)
  #   - Creates a GitHub Release + tag
  #   - Triggers push-release via the `new_release_version` output
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Build by architecture ─────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag_suffix: linux-amd64
            image: operator
            dockerfile: Dockerfile.operator
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: linux-arm64
            image: operator
            dockerfile: Dockerfile.operator
          - platform: linux/amd64
            runner: ubuntu-latest
            tag_suffix: linux-amd64
            image: remediation
            dockerfile: Dockerfile.remediation
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag_suffix: linux-arm64
            image: remediation
            dockerfile: Dockerfile.remediation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # The image's go build embeds the matrix (go:embed); download-matrix-compat already fetched it,
      # so just pull the artifact (a yaml) into the build context — no oras needed here.
      - name: Download compatibility matrix
        uses: actions/download-artifact@v4
        with:
          name: matrix
          path: internal/compat/

      # The image also embeds the CRDs (go:embed) so the operator installs them itself at startup.
      # The ci job produced them; drop them into the build context next to the embed directive.
      - name: Download CRDs
        uses: actions/download-artifact@v4
        with:
          name: crds
          path: internal/crd/

      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:v${{ needs.semantic-release.outputs.new_release_version }}-${{ matrix.tag_suffix }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.tag_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.tag_suffix }}

  # ─── Merge manifest list ────────────────────────────────────────────────────
  push:
    name: Push release image (merge manifest) - ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [build, semantic-release]
    strategy:
      matrix:
        image: [operator, remediation]
    steps:
      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest list and push
        env:
          VERSION: ${{ needs.semantic-release.outputs.new_release_version }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}/${{ matrix.image }}:v${VERSION} \
            -t ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest \
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:v${VERSION}-linux-amd64 \
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:v${VERSION}-linux-arm64

      - name: Inspect manifest
        run: docker buildx imagetools inspect ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
