# This rule is not used by the project liveim itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the mirror.mirror.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: liveim
    app.kubernetes.io/managed-by: kustomize
  name: namespacemirror-editor-role
rules:
- apiGroups:
  - mirror.mirror.dev
  resources:
  - namespacemirrors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mirror.mirror.dev
  resources:
  - namespacemirrors/status
  verbs:
  - get
